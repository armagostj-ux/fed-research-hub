name: Refresh Fed Research Hub

on:
  schedule:
    # Mondays 13:00 UTC = 8:00am Central (CDT) / 7:00am (CST). Cron is always UTC.
    - cron: "0 13 * * 1"
  workflow_dispatch: {}   # lets you run it on demand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull feeds and rebuild the page
        run: |
          python refresh_fed_hub.py
          mkdir -p public
          cp fed-research-hub.html public/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
